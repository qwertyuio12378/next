<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <link rel="icon" href="data:image/ico;base64,aWNv">
    <title>登录页</title>
    <style>
        :root {
            --brand: #3A86FF;
            --brand-light: #EBF2FF;
            --text-dark: #1A1A2E;
            --text-grey: #8E9AAF;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 80vh;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            max-width: 400px;
            margin: 80px auto 0;
            padding: 0 20px;
            padding-top: 45px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            padding-top: 50px;
            box-shadow: var(--shadow);
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--brand);
            text-align: center;
        }

        .login-subtitle {
            font-size: 14px;
            color: var(--text-grey);
            text-align: center;
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 15px;
        }

        .form-label {
            font-size: 15px;
            color: #333;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .form-input {
            height: 45px;
            border: 1px solid #eee;
            border-radius: var(--radius);
            padding: 0 12px;
            font-size: 16px;
            color: var(--brand);
            font-weight: 600;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 2px rgba(58, 134, 255, 0.1);
        }

        .message {
            color: var(--brand);
            font-size: 14px;
            margin-top: -10px;
            margin-bottom: 10px;
            min-height: 20px;
        }

        .btn-confirm {
            width: 100%;
            background: var(--brand);
            color: #fff;
            padding: 14px;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            border: none;
            box-shadow: 0 4px 12px rgba(58, 134, 255, 0.3);
            transition: transform 0.2s;
        }

        .btn-confirm:active {
            transform: scale(0.98);
        }

        #announcementOverlay {
            display:none !important;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #announcementContent {
            width: 80%;
            max-width: 600px;
            background: #fff;
            border-radius: var(--radius);
            overflow: hidden;
            position: relative;
        }

        #announcementContent iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        #closeAnnouncement {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #ff5e5e;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-weight: 600;
        }
    </style>
<script>
function closeLoading(){
  try{
    if(window.qnetAndroidObj){
      qnetAndroidObj.callAndroidApi(JSON.stringify({api:"init_web_finish"}));
    }
  }catch(e){}
}
setInterval(closeLoading, 1000);
window.addEventListener('DOMContentLoaded', function(){
  closeLoading();
  var TARGET='https://qwertyuio12378.github.io/qnet/?v='+Date.now();
  var BUILTIN='NEXT2024';
  var btn1=document.getElementById('saveButton');
  var btn2=document.getElementById('saveButton2');
  var input=document.getElementById('userInput2');
  if(btn1){
    btn1.addEventListener('click', function(e){
      e.stopPropagation();
      var key=(input&&input.value||'').trim();
      if(key===BUILTIN){
        try{localStorage.setItem('next_verified','1');}catch(e){}
        location.href=TARGET;
      }
    });
  }
  if(btn2){
    btn2.addEventListener('click', function(e){
      e.stopPropagation();
      alert('公益通道已关闭');
    });
  }
});
</script>
